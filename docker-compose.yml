version: "3.9"

services:
  mysql:
    image: mysql:8
    container_name: conversation-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conversation_workflow
      MYSQL_USER: app
      MYSQL_PASSWORD: app_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: conversation-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: conversation-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: mysql://app:app_secret@mysql:3306/conversation_workflow
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES_DAYS: "30"
      VOICE_BACKEND_URL: http://voice-backend:8000
      PORT: "3001"
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  flow-ai:
    build: ./flow-ai
    container_name: flow-ai
    ports:
      - "8080:8080"
    volumes:
      - ./flow-ai:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VOICE_BACKEND_URL=http://voice-backend:8000
      - VITE_VOICE_UI_URL=http://localhost:3000
      - VITE_API_URL=http://localhost:3001
      - API_URL=http://backend:3001
    depends_on:
      - voice-backend
      - backend
    restart: unless-stopped

  voice-backend:
    build:
      context: ./voice_agent
      dockerfile: backend/Dockerfile
    container_name: voice-backend
    ports:
      - "8000:8000"
    env_file:
      - ./voice_agent/.env
    environment:
      DATABASE_URL: mysql://app:app_secret@mysql:3306/conversation_workflow
      SESSION_TTL_SECONDS: "3600"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  voice-frontend:
    build:
      context: ./voice_agent
      dockerfile: frontend/Dockerfile
    container_name: voice-frontend
    ports:
      - "3000:3000"
    depends_on:
      - voice-backend
    restart: unless-stopped

volumes:
  mysql_data:
