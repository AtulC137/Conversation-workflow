version: "3.9"

services:
  flow-ai:
    build: ./flow-ai
    container_name: flow-ai
    ports:
      - "8080:8080"
    volumes:
      - ./flow-ai:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VOICE_BACKEND_URL=http://voice-backend:8000
      - VITE_VOICE_UI_URL=http://localhost:3000
    depends_on:
      - voice-backend
    restart: unless-stopped

  voice-backend:
    build:
      context: ./voice_agent
      dockerfile: backend/Dockerfile
    container_name: voice-backend
    ports:
      - "8000:8000"
    env_file:
      - ./voice_agent/.env
    restart: unless-stopped

  voice-frontend:
    build:
      context: ./voice_agent
      dockerfile: frontend/Dockerfile
    container_name: voice-frontend
    ports:
      - "3000:3000"
    depends_on:
      - voice-backend
    restart: unless-stopped
